name: Generate PB&J narration
on:
  workflow_dispatch:
    inputs:
      model:
        description: ElevenLabs speech model
        type: choice
        options:
          - eleven_v4
          - eleven_v3
        default: eleven_v4
permissions:
  contents: read
jobs:
  narration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install FFmpeg if needed
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Generate narration
        working-directory: pbj-history
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: cgSgspJ2msm6clMCkdW9
          ELEVENLABS_MODEL_ID: ${{ inputs.model }}
        run: python3 ../how-llms-work/prepare.py --provider elevenlabs --duration 103 --delivery delivery.json
      - uses: actions/upload-artifact@v4
        with:
          name: pbj-narration
          path: |
            pbj-history/public/narration.wav
            pbj-history/captions.srt
          if-no-files-found: error
